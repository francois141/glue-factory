model:
  name: lines.linea
  linea_variant: n  # n, s, m, or l
  input_size: 640
  score_threshold: 0.4
  min_length: 15
  force_num_lines: false
  # linea_root: null  # path to LINEA repo; if unset, uses external/LINEA
data:
  name: gluefactory.datasets.oxford_paris_mini_1view_jpldd
  data_dir: "revisitop1m_POLD2/jpg"  # as subdirectory of DATA_PATH(defined in settings.py)
  split: 'val'  # split must be selected
  grayscale: False
  num_workers: 1
  train_batch_size: 1
  val_batch_size: 1
  prefetch_factor: 1
  reshape: 800
  square_pad: False
  multiscale_learning:
    do: False
  load_features:
    do: False
  val_size: 500
  train_size: 11500
