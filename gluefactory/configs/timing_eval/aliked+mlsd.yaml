model:
    name: extractors.aliked+mlsd
    max_num_keypoints: 2048
    mlsd_size: tiny
    input_size: 512
data:
    name: gluefactory.datasets.oxford_paris_mini_1view_jpldd
    data_dir: "revisitop1m_POLD2/jpg"
    split: 'val'
    grayscale: False
    num_workers: 1
    val_batch_size: 1
    prefetch_factor: 1
    reshape: 800
    square_pad: False
    multiscale_learning:
        do: False
    load_features:
        do: False
    val_size: 500
    train_size: 11500
