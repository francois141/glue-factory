model:
    name: extractors.aliked+deeplsd
data:
    name: gluefactory.datasets.oxford_paris_mini_1view_jpldd
    data_dir: "revisitop1m_POLD2/jpg"  # as subdirectory of DATA_PATH(defined in settings.py)
    split: 'train'  # split must be selected
    grayscale: False
    num_workers: 1
    val_batch_size: 1
    prefetch_factor: 1
    reshape: 800  
    square_pad: False
    multiscale_learning:
        do: False  
    load_features:
        do: False
    val_size: 500
    train_size: 11500