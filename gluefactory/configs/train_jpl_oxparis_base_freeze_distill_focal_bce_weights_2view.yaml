data:
    name: oxford_paris_2view_jpldd
    data_dir: revisitop1m_POLD2/jpg
    grayscale: False
    num_workers: 16  # number of workers used by the Dataloader: recommended 4 * n_gpus (also given for all gpus)
    train_batch_size: 16  # given for all gpus
    val_batch_size: 8
    prefetch_factor: 2
    homography:
      difficulty: 0.5
      max_angle: 30
      patch_shape: [800, 800]
    photometric:
        p: 0.75
    load_features:
        do: True
        point_gt:
            force_num_keypoints: False # if this is True, need to not load points!
            load_keypoints: False
            use_score_heatmap: False
            max_num_keypoints: 63  # how many gt keypoints are loaded (could be used for kp losses later on). Needed for batching.
            max_num_heatmap_keypoints: -1 # number of gt keypoints used to create heatmap. Set to -1 to use all
        check_exists: True
    val_size: 500
    train_size: 11500
model:
    name: joint_point_line_extractor
    model_name: "aliked-n16"
    line_neighborhood: 5
    max_num_keypoints: 1500  # setting for training, for eval: -1
    subpixel_refinement: True  # # if activated the DKD module will apply arg-softmax refinement of keypoint positions
    line_df_decoder_channels: 64  # number of channels in CNN for af/df decoder branches
    freeze_lines: True  # if set to true, the line extractor and distance field branch will be frozen (no gradients are computed for them), also the backbone will be frozen
    training:
        do: True
        two_view: True
        aliked_pretrained: True
        pretrain_kp_decoder: True
        train_descriptors:
            use_one_view_loss: True # train with direct supervision of descriptors with ground truth descriptors
            gt_aliked_model: "aliked-n32"
            use_two_view_loss: False # use sparse nre loss to train descriptors
        loss:
            use_one_view_df_loss: False # as distance field branch + backbone is frozen, no change in update or output quality
            use_one_view_kp_loss: True # use one-view keypoint loss ex. focal, l1 etc
            kp_loss_name: "distill_dad_superpoint_bce_weighted"
            kp_loss_parameters:
                lambda_weighted_bce: 200
                focal_alpha: 0.25
                focal_gamma: 2
            loss_weights:
                keypoint_weight: 1
                one_view_descriptor_weight: 1
                softargmax_weight: 1
    line_detection:
      do: False
    checkpoint: assets/jpl_best_with_points.tar  # if given load model weights from this checkpoint
train:
    load_experiment: null  # initialize the model from a previous experiment (take weights)
    seed: 7
    epochs: 250
    log_every_iter: 8
    eval_every_iter: 15000 # automatically creates new checkpoint if new best eval metric is reached -> set > #batches to not eval except at the end of each epoch
    save_every_iter: 1000
    test_every_epoch: -1
    optimizer: "adam"
    best_key: "loss/total" # key used to determine best checkpoint and evaluation progress
    lr: 0.0001
    lr_schedule:
        type: 'ReduceLROnPlateau'
        on_epoch: True
        options:
            patience: 5
    keep_last_checkpoints: 500000
    submodules: []

