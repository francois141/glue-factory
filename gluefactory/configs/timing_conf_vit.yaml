model:
    name: extractors.joint_point_line_extractor
    aliked_model_name: "aliked-n16"
    max_num_keypoints: 2048  # setting for training, for eval: -1
    detection_threshold: 0.0
    # use_deeplsd_endpoints: true
    line_df_decoder_channels: 64  # adapt to your checkpoint!!
    line_af_decoder_channels: 32
    nms_radius: 3
    training:
      do: False
    backbone: "vit"
    checkpoint:  /cluster/scratch/fcosta/outputs/training/TRAIN_100k_VIT/checkpoint_best.tar
    timeit: True  # setting it to True -> gives 4-5 fps less performance
    line_detection:
      do: True
data:
    name: gluefactory.datasets.oxford_paris_mini_1view_jpldd
    data_dir: "revisitop1m_POLD2/jpg"
    split: 'val'  # split must be selected 
    grayscale: False
    num_workers: 2  
    train_batch_size: 1  
    val_batch_size: 1
    prefetch_factor: 2
    reshape: 800  
    square_pad: False 
    multiscale_learning:
        do: False  
    load_features:
        do: False
    val_size: 500
    train_size: 11500