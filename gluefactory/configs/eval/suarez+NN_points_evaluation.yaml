model:
  name: two_view_pipeline
  extractor:
    name: lines.wireframe_suarez
    max_num_keypoints: 2048
  matcher:
    name: matchers.nearest_neighbor_matcher
benchmarks:
  megadepth1500:
    data:
      preprocessing:
        side: long
        resize: 1600
    eval:
      estimator: poselib
      ransac_th: -1
      options:
        min_iterations: 2000
        max_iterations: 2000000
  scannet1500:
    data:
      preprocessing:
        side: long
        # resize: 1600
    eval:
      estimator: poselib
      ransac_th: -1
      options:
        min_iterations: 2000
        max_iterations: 2000000
    model:
      extractor:
        max_num_keypoints: 4096
  hpatches:
    data:
      preprocessing:
        side: long
        resize: 800
    eval:
      estimator: poselib
      ransac_th: -1
      options:
        min_iterations: 2000
        max_iterations: 2000000
    model:
      extractor:
        max_num_keypoints: 1024
  hpatches_lines:
    data:
      preprocessing:
        side: long
        resize: 800
    eval:
      estimator: poselib
      ransac_th: -1
    model:
      extractor:
        max_num_keypoints: 1024
