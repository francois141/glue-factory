model:
  name: two_view_pipeline
  extractor:
    name: lines.wireframe_suarez
  matcher:
    name: matchers.nearest_neighbor_matcher
benchmarks:
  megadepth1500:
    data:
      preprocessing:
        side: long
        resize: 1600
    eval:
      estimator: poselib
      ransac_th: -1
  hpatches:
