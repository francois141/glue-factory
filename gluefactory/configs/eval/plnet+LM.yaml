model:
  name: two_view_pipeline
  extractor:
    name: extractors.pl_net_extractor
    max_num_lines: 1000 # its set to 1000 internally, so allow all generated lines
    num_keypoints: null
  matcher:
    name: matchers.line_matcher
    line_dist: orth
benchmarks:
  megadepth1500:
    data:
      preprocessing:
        side: long
        resize: 1600
    eval:
      estimator: poselib
      ransac_th: -1
    model:
      extractor:
        max_num_junctions: 2048
        num_keypoints: null
  megadepth1500_extended:
    data:
      preprocessing:
        side: long
        resize: 1600
    eval:
      estimator: poselib
      ransac_th: -1
    model:
      extractor:
        max_num_junctions: 2048
        num_keypoints: null
  hpatches:
    data:
      preprocessing:
        side: long
        resize: 800
    eval:
      estimator: poselib
      ransac_th: -1
    model:
      extractor:
        max_num_junctions: 1024
        num_keypoints: null
    use_points: False
    use_lines: True
  hpatches_extended:
    data:
      preprocessing:
        side: long
        resize: 800
    eval:
      estimator: poselib
      ransac_th: -1
    model:
      extractor:
        max_num_junctions: 1024
        num_keypoints: null
  hpatches_lines:
    data:
      preprocessing:
        side: long
        resize: 800
  scannet1500:
    data:
      preprocessing:
        side: long
        resize: 800
    eval:
      estimator: poselib
      ransac_th: -1
    model:
      extractor:
        max_num_junctions: 1024
        num_keypoints: null
