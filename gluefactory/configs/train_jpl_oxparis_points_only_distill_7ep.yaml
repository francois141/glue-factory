# 7 epochs - distill only - full train on all components throughout
# (DAD+SuperPoint weighted-BCE distillation; no freezing; line branch not built)
data:
    name: gluefactory.datasets.oxford_paris_mini_1view_jpldd
    data_dir: "revisitop1m_POLD2/jpg"  # as subdirectory of DATA_PATH(defined in settings.py)
    grayscale: False
    num_workers: 16  # number of workers used by the Dataloader: recommended 4 * n_gpus (also given for all gpus)
    train_batch_size: 16  # given for all gpus
    val_batch_size: 8
    prefetch_factor: 2
    reshape: 800  # new resizing keeps aspect-ratio so quadratic image is not guaranteed
    square_pad: True  # thus for a batchsize > 1 square padding needs to be activated for batching
    multiscale_learning:
        do: False
        scales_list: [1000, 800, 600, 400]
        scale_selection: 'random'
    load_features:
        do: True
        check_exists: True
        point_gt:
            load_points: False
            use_score_heatmap: False
            max_num_keypoints: 63
            max_num_heatmap_keypoints: -1
            use_deeplsd_lineendpoints_as_kp_gt: False
            use_superpoint_kp_gt: True
        line_gt:
            enforce_threshold: 5.0
        augment:
            do: False
            type: "dark"
    val_size: 500
    train_size: 11500

model:
    name: joint_point_line_extractor
    model_name: "aliked-n16"
    line_neighborhood: 5
    max_num_keypoints: 1500
    subpixel_refinement: True
    line_df_decoder_channels: 64
    build_line_branch: False  # NEW: skip distance_field_branch + line_extractor entirely
    freeze_lines: False  # nothing frozen — train end-to-end
    training:
        do: True
        two_view: False
        aliked_pretrained: True
        pretrain_kp_decoder: True
        train_descriptors:
            use_one_view_loss: True  # descriptors trained with aliked-n32 GT (mirrors freeze-distill)
            gt_aliked_model: "aliked-n32"
        loss:
            use_one_view_df_loss: False  # line branch absent
            use_one_view_af_loss: False  # line branch absent
            use_one_view_kp_loss: True
            kp_loss_name: "distill_dad_superpoint_bce_weighted"  # weighted BCE distilling from DAD + SuperPoint
            kp_loss_parameters:
                lambda_weighted_bce: 200
                focal_alpha: 0.25
                focal_gamma: 2
            loss_weights:
                keypoint_weight: 1
                keypoint_dispersity_weight: 0
                one_view_descriptor_weight: 1
    line_detection:
      do: False
    checkpoint: null  # train from scratch
train:
    load_experiment: null
    seed: 7
    epochs: 7
    log_every_iter: 8
    eval_every_iter: 15000  # > #batches per epoch -> eval at epoch boundary only
    save_every_iter: 1000
    test_every_epoch: -1
    optimizer: "adam"
    best_key: "loss/total"
    lr: 0.0001
    lr_schedule:
        type: 'ReduceLROnPlateau'
        on_epoch: True
        options:
            patience: 5
    keep_last_checkpoints: 50
    submodules: []
